{% extends "base.html" %}
{% block title %}Sign in · SecureDocs{% endblock %}
{% block content %}
<section class="auth-layout"><div class="auth-aside"><div class="eyebrow">WELCOME BACK</div><h1>Secure access<br>starts here.</h1><p>Sign in to your private document workspace.</p></div>
<div class="form-card"><h2>Sign in</h2><p class="muted">Enter your SecureDocs account details.</p>
<form method="post">
<label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="40"></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="button primary full" type="submit">Sign in <span>→</span></button>
</form><p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}
